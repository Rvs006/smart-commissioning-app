name: Historical Windows Portable Bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release tag to rebuild, for example v0.1.33
        required: true
        type: string
      release_sha:
        description: Full 40-character commit SHA behind the release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: historical-windows-portable-${{ inputs.version }}-${{ inputs.release_sha }}
  cancel-in-progress: true

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_SHA: ${{ inputs.release_sha }}

jobs:
  build-and-accept:
    name: Build and accept ${{ inputs.version }}
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Check out the exact tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove tag, commit, and clean checkout identity
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release version '$env:RELEASE_VERSION' is not a stable vX.Y.Z tag."
          }
          if ($env:RELEASE_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Release SHA is not a full 40-character commit: $env:RELEASE_SHA"
          }
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -cne $env:RELEASE_SHA.ToLowerInvariant()) {
            throw "Checkout $actual does not match requested $env:RELEASE_SHA"
          }
          $tagCommit = (git rev-parse "$($env:RELEASE_VERSION)^{commit}").Trim().ToLowerInvariant()
          if ($tagCommit -cne $actual) {
            throw "Tag $env:RELEASE_VERSION points to $tagCommit, not $actual"
          }
          $checkoutStatus = @(git status --porcelain=v1 --untracked-files=all)
          if ($checkoutStatus.Count -ne 0) {
            throw 'Release checkout is dirty before build.'
          }

      - name: Apply the historical report-list compatibility fix
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'backend\app\services\run_service.py'
          $contents = Get-Content -LiteralPath $path -Raw
          $old = 'with session_factory(self._engine) as session:'
          $new = 'with session_factory(self._engine)() as session:'
          $oldCount = ([regex]::Matches($contents, [regex]::Escape($old))).Count
          $newCount = ([regex]::Matches($contents, [regex]::Escape($new))).Count
          if ($oldCount -gt 1 -or $newCount -gt 1) {
            throw "Unexpected report-list session factory shape in $path (old=$oldCount new=$newCount)."
          }
          if ($oldCount -eq 1) {
            $utf8 = New-Object System.Text.UTF8Encoding($false)
            [IO.File]::WriteAllText($path, $contents.Replace($old, $new), $utf8)
            'HISTORICAL_PATCH_APPLIED=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host 'Applied the v0.1.35 report-list session compatibility fix.'
          } elseif ($newCount -eq 1) {
            'HISTORICAL_PATCH_APPLIED=false' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host 'Historical tag already contains the report-list session fix.'
          } else {
            throw "Could not find the report-list session factory call in $path."
          }

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the exact tagged runtime
        shell: pwsh
        run: python -m pip install './core[bacnet]' ./backend pyinstaller==6.20.0

      - name: Run tagged core and backend suites
        shell: pwsh
        run: |
          python -m unittest discover -s core/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location backend
          try {
            python -m unittest discover -s tests
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }

      - name: Build the version-stamped portable bundle
        shell: pwsh
        run: pwsh packaging/windows_portable/build.ps1 -Version "$env:RELEASE_VERSION" -Clean

      - name: Verify version stamps and run the portable acceptance path
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'build\Smart_Commissioning_App_Windows_Portable'
          $bundleExe = Join-Path $bundle 'SmartCommissioningApp.exe'
          $readme = Join-Path $bundle 'README_FIRST.txt'
          $frontendVersion = Join-Path $bundle 'frontend\dist\.app-version'
          if (-not (Test-Path -LiteralPath $bundleExe)) { throw 'Portable executable is missing.' }
          if (-not (Test-Path -LiteralPath $readme)) { throw 'README_FIRST.txt is missing.' }
          if (-not (Test-Path -LiteralPath $frontendVersion)) { throw 'Frontend version stamp is missing.' }
          $productVersion = (Get-Item -LiteralPath $bundleExe).VersionInfo.ProductVersion
          if ($productVersion -cne $env:RELEASE_VERSION) {
            throw "EXE ProductVersion '$productVersion' is not '$env:RELEASE_VERSION'."
          }
          if (-not ((Get-Content -LiteralPath $readme -Raw) -match "Version: $([regex]::Escape($env:RELEASE_VERSION))")) {
            throw 'README_FIRST.txt does not carry the requested release version.'
          }
          if ((Get-Content -LiteralPath $frontendVersion -Raw).Trim() -cne $env:RELEASE_VERSION) {
            throw 'Frontend build stamp does not match the requested release version.'
          }

          # The acceptance helper deliberately proves that the portable launcher
          # handles Windows paths containing spaces. Exercise the same condition
          # as the user-facing launcher instead of running from the runner's
          # space-free checkout/temp roots.
          $launchRoot = Join-Path $env:RUNNER_TEMP "Historical portable acceptance path with spaces $env:GITHUB_RUN_ID"
          $stateRoot = Join-Path $env:RUNNER_TEMP "Historical portable state path with spaces $env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $launchRoot, $stateRoot | Out-Null
          Copy-Item -Path (Join-Path $bundle '*') -Destination $launchRoot -Recurse -Force
          $exe = Join-Path $launchRoot 'SmartCommissioningApp.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'historical-portable-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'historical-portable-stderr.log'
          $acceptance = Join-Path $bundle 'windows-acceptance.json'
          $env:SMART_COMMISSIONING_DATA_DIR = $stateRoot
          $env:RUN_LEASE_SECONDS = '15'
          $env:RUN_HEARTBEAT_SECONDS = '2'
          $proc = Start-Process -FilePath $exe -WorkingDirectory $launchRoot -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $healthUrl = $null
          $deadline = [DateTime]::UtcNow.AddSeconds(150)
          try {
            while ([DateTime]::UtcNow -lt $deadline) {
              if ($proc.HasExited) { throw "Portable executable exited early with code $($proc.ExitCode)." }
              $match = Select-String -LiteralPath $stdout, $stderr -Pattern 'http://127\.0\.0\.1:\d+' `
                -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($match) {
                $healthUrl = "$($match.Matches[0].Value)/api/v1/health"
                try {
                  $health = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 5
                  if ($health.StatusCode -eq 200) { break }
                } catch { }
              }
              Start-Sleep -Seconds 2
            }
            if (-not $healthUrl) { throw 'Could not discover the portable API URL.' }
            $baseUrl = $healthUrl -replace '/api/v1/health$', ''
            python scripts/smoke_windows_portable_release.py `
              --base-url $baseUrl --exe-path $exe --data-dir $stateRoot `
              --lease-seconds 15 --heartbeat-seconds 2 `
              --stdout-log $stdout --stderr-log $stderr --output $acceptance
            if ($LASTEXITCODE -ne 0) { throw 'Portable acceptance helper failed.' }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }

          $pythonSbom = Join-Path $bundle 'SBOM.python.cdx.json'
          python scripts/generate_sbom.py --json $pythonSbom `
            --application-version $env:RELEASE_VERSION --source-commit $env:RELEASE_SHA --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $npmSbom = Join-Path $bundle 'SBOM.npm.cdx.json'
          Push-Location frontend
          try {
            npm sbom --omit=dev --sbom-format cyclonedx --sbom-type application |
              Set-Content -LiteralPath $npmSbom -Encoding utf8
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          Copy-Item -LiteralPath 'docs\migration-rollback-v0.1.31.md' `
            -Destination (Join-Path $bundle 'MIGRATION_ROLLBACK.md')

          $productVersion = (Get-Item -LiteralPath $exe).VersionInfo.ProductVersion
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          python scripts/generate_release_evidence.py `
            --version $env:RELEASE_VERSION --product-version $productVersion `
            --commit $env:RELEASE_SHA --evidence-kind windows --output-dir $bundle `
            --repository $env:GITHUB_REPOSITORY `
            --workflow-artifact-name SmartCommissioningApp-windows-portable `
            --workflow-name "$env:GITHUB_WORKFLOW" --workflow-run-id $env:GITHUB_RUN_ID `
            --workflow-run-attempt $env:GITHUB_RUN_ATTEMPT --workflow-run-url $runUrl `
            --workflow-event $env:GITHUB_EVENT_NAME `
            --artifact $exe --artifact (Join-Path $bundle 'README_FIRST.txt') `
            --artifact (Join-Path $bundle 'MIGRATION_ROLLBACK.md') `
            --artifact (Join-Path $bundle 'windows-acceptance.json') `
            --sbom $pythonSbom --sbom $npmSbom `
            --gate windows_build=passed --gate windows_readiness=passed `
            --gate windows_long_heartbeat=passed --gate windows_cancellation=passed `
            --gate report_provenance=passed --gate report_byte_equality=passed `
            --gate path_with_spaces=passed --gate log_thread_inspection=passed `
            --gate app_root=passed --gate frontend_build_stamp=passed `
            --gate sqlite_lease_configuration=passed --gate sqlite_heartbeat_renewals=passed `
            --test core_unittest=passed --test backend_unittest=passed `
            --test release_heartbeat_integration=passed --test portable_readiness=passed `
            --test portable_acceptance=passed --test portable_long_heartbeat=passed `
            --test portable_cancellation=passed --test canonical_udmi=passed `
            --test portable_report_provenance=passed --test portable_report_byte_equality=passed `
            --test portable_path_with_spaces=passed --test portable_log_thread_inspection=passed `
            --test portable_app_root=passed --test portable_frontend_build_stamp=passed `
            --test portable_sqlite_lease_configuration=passed `
            --test portable_sqlite_heartbeat_renewals=passed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $evidencePath = Join-Path $bundle 'release-evidence.json'
          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          if ([string]$evidence.source_commit -ine $env:RELEASE_SHA -or
              [string]$evidence.product_version -cne $env:RELEASE_VERSION) {
            throw 'Generated release evidence does not match the requested tag and version.'
          }

      - name: Upload the exact portable bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SmartCommissioningApp-windows-portable
          path: build/Smart_Commissioning_App_Windows_Portable
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
