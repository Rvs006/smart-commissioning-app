# Build the real Windows portable executable, exercise it through its HTTP API,
# and retain exact-SHA evidence only after every acceptance check succeeds.
name: Windows Portable Bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version stamped into the exe, README_FIRST, and evidence
        required: true
        default: v0.1.29
      release_sha:
        description: Full 40-character commit SHA to build from current main
        required: true
  pull_request:
    paths:
      - "packaging/**"
      - "backend/**"
      - "core/**"
      - "worker/**"
      - "frontend/**"
      - "scripts/**"
      - "docs/migration-rollback-v0.1.29.md"
      - ".github/workflows/windows-portable.yml"
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - "backend/**"
      - "core/**"
      - "worker/**"
      - "frontend/**"
      - "scripts/**"
      - "docs/migration-rollback-v0.1.29.md"
      - ".github/workflows/windows-portable.yml"

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ inputs.release_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  RELEASE_VERSION: ${{ inputs.version || 'v0.1.29' }}
  RELEASE_SHA: ${{ inputs.release_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  build-and-boot:
    name: Build + accept Windows portable exe
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove PR-head candidate or exact-main release checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($env:RELEASE_SHA -notmatch '^[0-9a-f]{40}$') {
            throw "Release SHA is not a full commit: $env:RELEASE_SHA"
          }
          if ($actual -cne $env:RELEASE_SHA.ToLowerInvariant()) {
            throw "Checkout $actual does not match requested $env:RELEASE_SHA"
          }
          if ($env:RELEASE_VERSION -cne 'v0.1.29') {
            throw "This workflow is pinned to v0.1.29, not '$env:RELEASE_VERSION'."
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            git fetch origin main --no-tags
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch origin/main.' }
            $main = (git rev-parse origin/main).Trim().ToLowerInvariant()
            if ($actual -cne $main) {
              throw "Release dispatch must build exact origin/main $main, not $actual."
            }
          }
          $checkoutStatus = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the release checkout.' }
          if ($checkoutStatus.Count -ne 0) { throw 'Release checkout is dirty before build.' }

      - name: Parse release publisher with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts\release-portable.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            throw 'release-portable.ps1 failed the Windows PowerShell 5.1 parser.'
          }

      - name: Reject missing immutable image references under Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\test_release_portable_ps51.ps1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # A regular install is intentional: PyInstaller cannot reliably follow
      # editable finders. core[bacnet] ensures the real BACnet backend is frozen.
      - name: Install Python packages + PyInstaller
        run: python -m pip install "./core[bacnet]" ./backend pyinstaller==6.20.0

      - name: Shortened real-repository heartbeat, fencing, and Stop gates
        shell: pwsh
        run: |
          python -m unittest discover -s core/tests -p 'test_run_lifecycle_v2.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s core/tests -p 'test_owned_run_heartbeat.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s backend/tests -p 'test_run_dispatch_async.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s backend/tests -p 'test_inline_heartbeat_integration.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s worker/tests -p 'test_tasks_interrupt.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build portable bundle (frontend + freeze + assemble)
        shell: pwsh
        run: pwsh packaging/windows_portable/build.ps1 -Version "$env:RELEASE_VERSION"

      - name: Add exact-SHA SBOM and migration payloads
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'build\Smart_Commissioning_App_Windows_Portable'
          $pythonSbom = Join-Path $bundle 'SBOM.python.cdx.json'
          $npmSbom = Join-Path $bundle 'SBOM.npm.cdx.json'
          python scripts/generate_sbom.py --json $pythonSbom `
            --application-version $env:RELEASE_VERSION --source-commit $env:RELEASE_SHA --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location frontend
          try {
            npm sbom --omit=dev --sbom-format cyclonedx --sbom-type application |
              Set-Content -LiteralPath $npmSbom -Encoding utf8
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          Copy-Item -LiteralPath 'docs\migration-rollback-v0.1.29.md' `
            -Destination (Join-Path $bundle 'MIGRATION_ROLLBACK.md')

      - name: Portable acceptance path with spaces, heartbeat, Stop, report, and logs
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'build\Smart_Commissioning_App_Windows_Portable'
          $launchRoot = Join-Path $env:RUNNER_TEMP "Portable acceptance path with spaces $env:GITHUB_RUN_ID $env:GITHUB_RUN_ATTEMPT"
          $stateRoot = Join-Path $env:RUNNER_TEMP "Portable state path with spaces $env:GITHUB_RUN_ID $env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $launchRoot, $stateRoot | Out-Null
          Copy-Item -Path (Join-Path $bundle '*') -Destination $launchRoot -Recurse
          $exe = Join-Path $launchRoot 'SmartCommissioningApp.exe'
          $out = Join-Path $env:RUNNER_TEMP 'app-stdout.log'
          $err = Join-Path $env:RUNNER_TEMP 'app-stderr.log'
          $stdin = Join-Path $env:RUNNER_TEMP 'app-stdin.txt'
          $env:SMART_COMMISSIONING_DATA_DIR = $stateRoot
          $env:RUN_LEASE_SECONDS = '15'
          $env:RUN_HEARTBEAT_SECONDS = '2'
          Set-Content -LiteralPath $stdin -Value '' -NoNewline

          $productVersion = (Get-Item -LiteralPath $exe).VersionInfo.ProductVersion
          if ($productVersion -cne $env:RELEASE_VERSION) {
            throw "SmartCommissioningApp.exe ProductVersion '$productVersion' is not '$env:RELEASE_VERSION'."
          }
          $frontendVersionPath = Join-Path $launchRoot 'frontend\dist\.app-version'
          $frontendVersion = (Get-Content -LiteralPath $frontendVersionPath -Raw).Trim()
          if ($frontendVersion -cne $env:RELEASE_VERSION) {
            throw "Frontend build stamp '$frontendVersion' is not '$env:RELEASE_VERSION'."
          }
          $proc = Start-Process -FilePath $exe -WorkingDirectory $launchRoot -PassThru -NoNewWindow `
            -RedirectStandardOutput $out -RedirectStandardError $err -RedirectStandardInput $stdin
          $healthUrl = $null
          $deadline = [DateTime]::UtcNow.AddSeconds(150)
          $ok = $false
          try {
            while ([DateTime]::UtcNow -lt $deadline) {
              if ($proc.HasExited) { throw "exe exited early with code $($proc.ExitCode)" }
              $match = Select-String -LiteralPath $out, $err -Pattern 'http://127\.0\.0\.1:\d+' `
                -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($match) {
                $healthUrl = "$($match.Matches[0].Value)/api/v1/health"
                try {
                  $health = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 5
                  if ($health.StatusCode -eq 200) { break }
                } catch { }
              }
              Start-Sleep -Seconds 2
            }
            if (-not $healthUrl) { throw 'Could not discover the portable API URL.' }
            $health = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 5
            if ($health.StatusCode -ne 200) { throw 'Portable health endpoint did not return HTTP 200.' }

            $actualProcess = Get-Process -Id $proc.Id
            if ([IO.Path]::GetFullPath($actualProcess.Path) -cne [IO.Path]::GetFullPath($exe)) {
              throw "Running process path '$($actualProcess.Path)' is not '$exe'."
            }
            foreach ($requiredPath in @(
              (Join-Path $launchRoot '_internal\psutil'),
              (Join-Path $launchRoot '_internal\bacpypes3'),
              (Join-Path $launchRoot '_internal\smart_commissioning_core\schemas\udmi\1.5.2\state.json')
            )) {
              if (-not (Test-Path -LiteralPath $requiredPath)) {
                throw "Frozen dependency is missing: $requiredPath"
              }
            }

            $apiBase = $healthUrl -replace '/api/v1/health$', ''
            python scripts/smoke_windows_portable_release.py `
              --base-url $apiBase --exe-path $exe --data-dir $stateRoot `
              --lease-seconds 15 --heartbeat-seconds 2 `
              --stdout-log $out --stderr-log $err `
              --output (Join-Path $bundle 'windows-acceptance.json')
            if ($LASTEXITCODE -ne 0) { throw 'Portable release acceptance helper failed.' }
            if (Test-Path -LiteralPath (Join-Path $launchRoot 'runtime\smart_commissioning.db')) {
              throw 'Portable state leaked beside the executable.'
            }
            $ok = $true
          }
          finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            Write-Host '--- exe stdout ---'
            Get-Content -LiteralPath $out -ErrorAction SilentlyContinue
            Write-Host '--- exe stderr ---'
            Get-Content -LiteralPath $err -ErrorAction SilentlyContinue
            Write-Host '--- isolated portable acceptance logs ---'
            Get-ChildItem -Path (Join-Path $stateRoot 'logs') -Filter '*.log*' -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "== $($_.Name) =="; Get-Content -LiteralPath $_.FullName }
          }
          if (-not $ok) { throw 'Portable acceptance failed.' }

      - name: Generate and validate enriched Windows evidence
        shell: pwsh
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'build\Smart_Commissioning_App_Windows_Portable'
          $exe = Join-Path $bundle 'SmartCommissioningApp.exe'
          $productVersion = (Get-Item -LiteralPath $exe).VersionInfo.ProductVersion
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          python scripts/generate_release_evidence.py `
            --version $env:RELEASE_VERSION --product-version $productVersion `
            --commit $env:RELEASE_SHA --evidence-kind windows --output-dir $bundle `
            --repository $env:GITHUB_REPOSITORY `
            --workflow-artifact-name SmartCommissioningApp-windows-portable `
            --workflow-name "$env:GITHUB_WORKFLOW" --workflow-run-id $env:GITHUB_RUN_ID `
            --workflow-run-attempt $env:GITHUB_RUN_ATTEMPT --workflow-run-url $runUrl `
            --workflow-event $env:GITHUB_EVENT_NAME `
            --artifact $exe --artifact (Join-Path $bundle 'MIGRATION_ROLLBACK.md') `
            --artifact (Join-Path $bundle 'windows-acceptance.json') `
            --sbom (Join-Path $bundle 'SBOM.python.cdx.json') `
            --sbom (Join-Path $bundle 'SBOM.npm.cdx.json') `
            --gate windows_build=passed --gate windows_readiness=passed `
            --gate windows_long_heartbeat=passed --gate windows_cancellation=passed `
            --gate report_provenance=passed --gate report_byte_equality=passed `
            --gate path_with_spaces=passed --gate log_thread_inspection=passed `
            --gate app_root=passed --gate frontend_build_stamp=passed `
            --gate sqlite_lease_configuration=passed --gate sqlite_heartbeat_renewals=passed `
            --test release_heartbeat_integration=passed --test portable_readiness=passed `
            --test portable_long_heartbeat=passed --test portable_cancellation=passed `
            --test canonical_udmi=passed --test portable_report_provenance=passed `
            --test portable_report_byte_equality=passed --test portable_path_with_spaces=passed `
            --test portable_log_thread_inspection=passed --test portable_app_root=passed `
            --test portable_frontend_build_stamp=passed `
            --test portable_sqlite_lease_configuration=passed `
            --test portable_sqlite_heartbeat_renewals=passed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/validate_v0129_release_evidence.py `
            --evidence (Join-Path $bundle 'release-evidence.json') `
            --version $env:RELEASE_VERSION --product-version $productVersion `
            --commit $env:RELEASE_SHA --evidence-kind windows `
            --repository $env:GITHUB_REPOSITORY `
            --workflow-artifact-name SmartCommissioningApp-windows-portable `
            --workflow-name "$env:GITHUB_WORKFLOW" --workflow-run-id $env:GITHUB_RUN_ID `
            --workflow-run-attempt $env:GITHUB_RUN_ATTEMPT `
            --workflow-event $env:GITHUB_EVENT_NAME --search-root $bundle `
            --require-gate windows_build --require-gate windows_readiness `
            --require-gate windows_long_heartbeat --require-gate windows_cancellation `
            --require-gate report_provenance --require-gate report_byte_equality `
            --require-gate path_with_spaces --require-gate log_thread_inspection `
            --require-gate app_root --require-gate frontend_build_stamp `
            --require-gate sqlite_lease_configuration --require-gate sqlite_heartbeat_renewals `
            --require-test release_heartbeat_integration --require-test portable_readiness `
            --require-test portable_long_heartbeat --require-test portable_cancellation `
            --require-test canonical_udmi --require-test portable_report_provenance `
            --require-test portable_report_byte_equality --require-test portable_path_with_spaces `
            --require-test portable_log_thread_inspection --require-test portable_app_root `
            --require-test portable_frontend_build_stamp `
            --require-test portable_sqlite_lease_configuration `
            --require-test portable_sqlite_heartbeat_renewals

      - name: Upload bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SmartCommissioningApp-windows-portable
          path: build/Smart_Commissioning_App_Windows_Portable
          # The release publisher requires the build-bound frontend stamp at
          # frontend/dist/.app-version. upload-artifact v4 excludes dotfiles
          # unless this is explicit, even when the containing directory is named.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload failed bundle and acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SmartCommissioningApp-windows-portable-failed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/Smart_Commissioning_App_Windows_Portable
            ${{ runner.temp }}/app-stdout.log
            ${{ runner.temp }}/app-stderr.log
            ${{ runner.temp }}/Portable state path with spaces ${{ github.run_id }} ${{ github.run_attempt }}/logs
          if-no-files-found: warn
          retention-days: 7

      - name: Kill leftover exe
        if: always()
        shell: pwsh
        run: Stop-Process -Name SmartCommissioningApp -Force -ErrorAction SilentlyContinue
