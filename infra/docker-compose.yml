# Hosted deployment profile for the Smart Commissioning App.
# (The portable Windows exe under packaging/windows_portable is the edge
# profile; see infra/README.md for the runbook.)
#
# Secrets come from infra/.env (copy infra/.env.example and fill it in).
# Variables written as ${VAR:?...} make `docker compose` fail fast with a
# clear error instead of starting with an empty password/key.
#
# All published ports bind to 127.0.0.1 only. Put a TLS-terminating reverse
# proxy in front of the frontend port to expose the app beyond the host.

# Shared by api and worker: both talk to the same Postgres database and the
# same password-protected Redis. The URLs are assembled here so the password
# lives in exactly one .env variable each.
x-image-build-args: &image-build-args
  APP_VERSION: "${APP_VERSION:-v0.1.50}"
  SOURCE_COMMIT: "${SOURCE_COMMIT:-unknown}"
  SOURCE_REPOSITORY: "${SOURCE_REPOSITORY:-https://github.com/Rvs006/smart-commissioning-app}"

x-app-env: &app-env
  DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required (copy infra/.env.example to infra/.env)}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (copy infra/.env.example to infra/.env)}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required (copy infra/.env.example to infra/.env)}"
  REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required (copy infra/.env.example to infra/.env)}@redis:6379/0"
  JOB_EXECUTION_MODE: "queue"
  SMART_COMMISSIONING_DEPLOYMENT_ID: "${SMART_COMMISSIONING_DEPLOYMENT_ID:?SMART_COMMISSIONING_DEPLOYMENT_ID is required (a stable, non-secret deployment name)}"
  # Deliberately blank in the stock two-container topology: api and worker do
  # not share one OS network namespace, so the api cannot freeze the worker's
  # NIC inventory honestly. A deployment override may set this only after it
  # co-locates the two processes in one namespace and pins this queue lane to it.
  SMART_COMMISSIONING_NETWORK_EXECUTOR_ID: "${SMART_COMMISSIONING_NETWORK_EXECUTOR_ID:-}"
  SMART_COMMISSIONING_RUNTIME_ROOT: "/app/runtime"
  SMART_COMMISSIONING_SECRETS_ROOT: "/app/runtime/secrets"
  SMART_COMMISSIONING_ARTIFACTS_ROOT: "/app/runtime/artifacts"

services:
  # Production frontend: static Vite build served by nginx, which also
  # proxies /api/* to the api service so the browser talks to one origin.
  frontend:
    image: "${FRONTEND_IMAGE:-smart-commissioning-frontend:local}"
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args: *image-build-args
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  # Initializes ownership and the encrypted-store key before either long-lived
  # service starts. The key stays in the named secret_store volume; it is never
  # supplied through Compose environment or copied into an image layer.
  runtime-init:
    image: "${API_IMAGE:-smart-commissioning-api:local}"
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args: *image-build-args
    user: "0:0"
    restart: "no"
    environment:
      SMART_COMMISSIONING_RUNTIME_ROOT: "/app/runtime"
      SMART_COMMISSIONING_SECRETS_ROOT: "/app/runtime/secrets"
      SMART_COMMISSIONING_ARTIFACTS_ROOT: "/app/runtime/artifacts"
      SMART_COMMISSIONING_REPORT_SIGNING_ROOT: "/app/runtime/report-signing"
    volumes:
      - api_runtime:/app/runtime
      - secret_store:/app/runtime/secrets
      - report_artifacts:/app/runtime/artifacts
      - report_signing:/app/runtime/report-signing
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        python -c "from app.services.configuration_service import _secret_store_key; _secret_store_key()"
        chown -R app:app /app/runtime

  # Run/import/configuration records live in Postgres (DATABASE_URL); the API
  # applies Alembic migrations on startup (backend owns the schema). The API
  # owns uploaded imports, immutable report artifacts, and report signing. The
  # worker receives only a read-only mount of the encrypted connection secrets.
  api:
    image: "${API_IMAGE:-smart-commissioning-api:local}"
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args: *image-build-args
    restart: unless-stopped
    environment:
      <<: *app-env
      AUTH_MODE: api_key
      API_KEY: "${API_KEY:?API_KEY is required (generate with openssl rand -hex 32)}"
      SMART_COMMISSIONING_REPORT_SIGNING_ROOT: "/app/runtime/report-signing"
      # Comma-separated browser origins allowed by CORS. Browser traffic
      # normally arrives same-origin through the nginx /api proxy (no CORS
      # involved); this only matters for direct cross-origin API access.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
    ports:
      # Loopback-only direct API access for local debugging (psql-style poking,
      # curl against /api/v1/...). Browsers should go through the frontend.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - api_runtime:/app/runtime
      - secret_store:/app/runtime/secrets
      - report_artifacts:/app/runtime/artifacts
      - report_signing:/app/runtime/report-signing
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # python:slim ships no curl/wget; probe readiness with stdlib urllib.
      # urlopen raises (non-zero exit) on connection errors and on 503.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # The worker reads/writes run rows through the same DATABASE_URL but never
  # runs migrations. It waits for API readiness and proves exact schema head,
  # encrypted-secret access, queue access, task import, and BACnet import.
  worker:
    image: "${WORKER_IMAGE:-smart-commissioning-worker:local}"
    build:
      context: ..
      dockerfile: worker/Dockerfile
      args: *image-build-args
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      - secret_store:/app/runtime/secrets:ro
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Readiness proves the queue, exact Alembic head, encrypted store/key, task
    # module, and real BACnet dependency are all available to this container.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import os; from pathlib import Path; import redis, bacpypes3; from alembic.script import ScriptDirectory; from sqlalchemy import text; from app.db import get_engine; from smart_commissioning_core.db.migrate import build_alembic_config; import app.tasks; redis.from_url(os.environ['REDIS_URL']).ping(); engine=get_engine(); current=engine.connect().execute(text('SELECT version_num FROM alembic_version')).scalar_one(); head=ScriptDirectory.from_config(build_alembic_config(os.environ['DATABASE_URL'])).get_current_head(); assert current == head, (current, head); key=Path(os.environ['SMART_COMMISSIONING_SECRETS_ROOT']) / '.secret_store_key'; assert key.is_file(); assert key.open('rb').read(1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required (copy infra/.env.example to infra/.env)}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (copy infra/.env.example to infra/.env)}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (generate with openssl rand -hex 32)}"
    ports:
      # Loopback-only so developers can reach the database with psql from the
      # host. Drop this mapping entirely if host access is not needed.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$VAR defers expansion to the container shell; a single $ would be
      # interpolated by compose on the host instead.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # No published port on purpose: only api and worker need Redis, and they
  # reach it over the compose network. For ad-hoc debugging from the host use:
  #   docker compose -f infra/docker-compose.yml exec redis sh -c 'redis-cli -a "$REDIS_PASSWORD" ping'
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required (generate with openssl rand -hex 32)}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
  api_runtime:
  secret_store:
  report_artifacts:
  report_signing:
